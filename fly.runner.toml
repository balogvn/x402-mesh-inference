# Fly.io deployment for the sustained-volume runner.
#
# This process spends real MainNet USDC on a schedule with nobody watching. Everything below
# is arranged around that fact.
#
#   fly apps create x402-mesh-runner
#   fly secrets set AVM_PRIVATE_KEY=... REDIS_URL=... -a x402-mesh-runner
#   fly deploy -c fly.runner.toml
#
# To stop it spending, without deleting anything:
#   fly machine stop -a x402-mesh-runner
#
# The daily cap is enforced in Redis under a UTC-dated key, NOT in process memory. That is the
# difference between a spend limit and a spend limit per restart: a crash-looping container
# with an in-memory budget would spend one budget per restart and every log line would look
# correct. Point REDIS_URL at the same instance the gateway uses.

app = "x402-mesh-runner"
primary_region = "iad"

[build]
  dockerfile = "docker/Dockerfile.runner"

# Non-secret configuration only. AVM_PRIVATE_KEY and REDIS_URL are secrets — the first is a
# funded wallet, the second is what makes the spend cap real.
[env]
  NODE_ENV = "production"

  # The endpoint to pay. Deliberately the tagged one: /v1/inference is the resource the
  # challenge leaderboard indexed, and settlements against /v1/chat/completions land on an
  # entry whose stored metadata predates the tag and cannot be refreshed.
  RUNNER_URL = "https://x402-mesh-gateway.fly.dev/v1/inference"

  # 15 minutes: 96 requests a day. Paired with the gateway's 6-hour batch deadline this costs
  # ~4 payout fees a day rather than 96 — see the MESH_PAYOUT_BATCH_MAX_DELAY_MS note in
  # fly.toml for why the deadline, not the threshold, sets the fee bill at this rate.
  RUNNER_INTERVAL_S = "900"

  # Hard ceiling per UTC day, enforced in Redis. At $0.0060 a request this is ~33 requests a
  # day, so it binds before the 96 the interval would otherwise allow — deliberately, so a
  # price change cannot silently multiply the spend.
  RUNNER_DAILY_BUDGET_USDC = "0.20"

  # Never drain the payer. Leaves enough to make the state obvious rather than bottoming out.
  RUNNER_FLOOR_USDC = "0.002"

# One machine, no autoscaling, no HTTP service. It serves nothing; it only makes requests.
[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"

[processes]
  app = ""

# Restart on failure so a transient network fault does not silently end the campaign — but the
# daily cap is what makes that safe. Without the Redis counter, "restart on failure" and "hard
# spend limit" are contradictory requirements.
[deploy]
  strategy = "immediate"
