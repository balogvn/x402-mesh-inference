# Fly.io deployment for the x402 Mesh gateway.
#
# Create the app once, then deploy:
#
#   fly apps create x402-mesh-gateway
#   fly secrets set X402_PAY_TO_ADDRESS=... AVM_PRIVATE_KEY=...
#   fly deploy
#
# See docs/deploy-fly.md for the full runbook, including why the payout key is a
# secret rather than an env entry and how to flip this to MainNet.

app = "x402-mesh-gateway"
primary_region = "iad"

# Long enough for the shutdown handler to pay out every accrued operator balance before the
# platform SIGKILLs. Payout retries span ~21s and SHUTDOWN_GRACE_MS is 30s, so anything less
# than that turns a deploy into unpaid operators. Fly's default is 5s.
kill_timeout = "35s"

[build]
  dockerfile = "docker/Dockerfile.gateway"

# Non-secret configuration only. Anything here is readable by anyone who can read the
# repository, so the payout address is the ONLY account value that belongs in this file —
# and even that is set as a secret below so a fork cannot silently inherit it.
[env]
  PORT = "8402"
  HOST = "0.0.0.0"
  NODE_ENV = "production"
  LOG_LEVEL = "info"

  # MainNet. The x402 Global Challenge counts MainNet settlements only — "Testnet is for
  # validation only; it does not count toward the leaderboard" — so the whole loop was proved
  # on TestNet and then flipped here.
  #
  # This is ALSO set as a Fly secret, and the secret wins over this file. Both are kept in
  # sync deliberately: leaving this at "testnet" would mean a deploy that lost the secret
  # silently settles on the wrong chain, which is the kind of mismatch nothing else catches.
  MESH_NETWORK = "mainnet"

  # Must be the URL clients actually reach: it is baked into every 402 challenge and into
  # the discovery manifest, so a wrong value produces challenges nobody can pay against.
  # Update this if you rename the app or attach a custom domain.
  MESH_PUBLIC_BASE_URL = "https://x402-mesh-gateway.fly.dev"

  # Per-model prices. The flat MESH_INBOUND_PRICE_USDC ($0.0020) still applies to anything
  # not listed here.
  #
  # llama-3.3-70b-versatile is the only model the mesh currently serves, and at the flat
  # price it was break-even at best: 1500 bps of $0.0020 is $0.0003 of margin, and the
  # payout transaction costs 0.001 ALGO — about $0.0003 at ALGO $0.30. Every request netted
  # zero, and above that ALGO price each one lost money. At $0.0060 the margin is $0.0009
  # against the same fixed fee, so the unit economics clear the chain cost with room.
  #
  # Batching (below) is the structural fix and is now in place, so the fee is amortized
  # across a batch rather than charged per request. This price and that batching are
  # complementary, not alternatives.
  MESH_MODEL_PRICES = '{"llama-3.3-70b-versatile":"0.0060"}'

  # Batch operator payouts. Each payout transaction costs a flat 0.001 ALGO (~$0.0003 at ALGO
  # $0.30) whatever its size, so paying per request spent a third of the $0.0009 margin on
  # fees. At $0.25 that fee is ~0.12% of the transfer.
  #
  # $0.05 / 2 minutes was chosen when accruals lived only in memory, so both numbers were
  # really caps on how much unpaid liability a crash could destroy. REDIS_URL now makes them
  # durable and crash recovery is verified against a real SIGKILL, so they can be set on
  # economics instead of on fear.
  #
  # Past ~$0.25 the saving stops mattering: the fee is already a rounding error against the
  # transfer, and every further step buys less while making operators wait longer. The
  # 15-minute ceiling means an operator is paid at least four times an hour even if the mesh
  # is nearly idle, which is also what keeps /v1/settlements looking alive to anyone watching.
  # Whatever is owed in the meantime is visible at /v1/payouts/pending.
  MESH_PAYOUT_BATCH_MIN_USDC = "0.25"
  MESH_PAYOUT_BATCH_MAX_DELAY_MS = "900000"

  # A publicly reachable gateway must not accept node endpoints on private address space —
  # that is the SSRF guard. Leave this false here; it is only relaxed for local development.
  MESH_ALLOW_PRIVATE_NODE_ENDPOINTS = "false"

  # Fly terminates TLS and forwards over its private network, adding exactly one hop. This
  # is what lets the rate limiter see the real client IP instead of the proxy's. Do not
  # raise it: over-counting lets a client spoof X-Forwarded-For and mint its own bucket.
  MESH_TRUST_PROXY_HOPS = "1"

[http_service]
  internal_port = 8402
  force_https = true

  # Keep one machine warm. Fly's cold start is quick, but a judge or an autonomous agent
  # hitting a stopped machine sees a delay on the very first request, which is exactly the
  # request that matters most here. Drop to auto_stop_machines = true if cost matters more.
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 250

# Liveness only — deliberately NOT /readyz.
#
# /readyz answers "can I take a paid request right now", which includes the payout wallet
# being funded and opted in to USDC. Wiring that to Fly's health check would make an
# unfunded wallet fail the deployment and roll it back, so a fresh deploy could never come
# up long enough to be funded. /healthz proves the process is alive and serving; check
# /readyz yourself after funding (`curl https://<app>.fly.dev/readyz`).
[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  grace_period = "20s"
  method = "GET"
  path = "/healthz"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
